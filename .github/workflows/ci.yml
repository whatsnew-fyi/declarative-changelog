name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Dogfood: this repo's own changelog must be a conformant declarative changelog.
      - run: node dist/cli.js validate CHANGELOG.md --require-level 2 --max-warnings 0

  templates:
    name: Release-tool templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/package-lock.json
      - run: npm ci
      # Each template runs the real tool, pinned in templates/package.json,
      # over a fixture repository; its output must reach Level 2 with no
      # warnings and match the golden file.
      - run: npm ci
        working-directory: templates
      - run: npm test
        working-directory: templates

  action:
    name: The GitHub Action, on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The action runs the CLI from npm; point it at this commit's build instead.
      - id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          version: file:./${{ steps.pack.outputs.tarball }}
          max-warnings: "0"
